<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Parent App — Legal</title>
<style>
  :root {
    --primary: #1A73E8;
    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --text: #1A1A2E;
    --muted: #6B7280;
    --divider: #E8EAED;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  h1 {
    color: var(--primary);
    font-size: 28px;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
  }
  .cards {
    display: grid;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, transform 0.15s;
    display: block;
  }
  .card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--primary);
    margin: 0 0 6px;
  }
  .card-desc {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Teacher Parent App</h1>
      <p class="subtitle">Legal documents</p>
    </header>

    <div class="cards">
      <a class="card" href="privacy-policy.html">
        <p class="card-title">Privacy Policy</p>
        <p class="card-desc">How we collect, use, and protect your personal information.</p>
      </a>
      <a class="card" href="terms.html">
        <p class="card-title">Terms &amp; Conditions</p>
        <p class="card-desc">The terms that govern your use of the Teacher Parent App.</p>
      </a>
    </div>

    <footer>
      &copy; Tecvo (Pty) Ltd. &middot;
      <a href="mailto:support@tecvo.co.za">support@tecvo.co.za</a>
    </footer>
  </div>
</body>
</html>
